[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mynet-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Mynet (one of Türkiye's biggest portals) — latest news, full articles, live gold prices, daily horoscope"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
mynet-mcp = "mynet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mynet_mcp"]
